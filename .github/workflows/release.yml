# Release: tag `v*` -> compiled binaries attached to the GitHub Release.
#
# Flow: create the release (idempotent) -> matrix build per OS ->
# smoke each binary WITHOUT `muse` present (`--support` must exit 0
# with reachable:false) -> upload with --clobber so re-running a
# failed release repairs it instead of duplicating assets.
#
# Platform honesty: the Windows asset compiles and serves HTTP, but
# Meta ships no native Windows `muse` CLI (Windows users run the
# Linux binary under WSL2). macOS is included because `muse`
# supports it. See SETUP.md.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: muse-bridge-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: muse-bridge-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: muse-bridge-macos-aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: smoke test (no muse present)
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.asset }}"
          case "${{ matrix.os }}" in
            windows-latest) SRC="target/${{ matrix.target }}/release/muse-bridge.exe" ;;
            *) SRC="target/${{ matrix.target }}/release/muse-bridge" ;;
          esac
          cp "$SRC" "$BIN"
          ./$BIN --help > /dev/null
          MUSE_CLI=definitely-not-a-real-binary \
            ./$BIN --support 2>/dev/null | grep -q '"reachable": false'
      - run: sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
        working-directory: target/${{ matrix.target }}/release
      - run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
        working-directory: target/${{ matrix.target }}/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ matrix.asset }}
