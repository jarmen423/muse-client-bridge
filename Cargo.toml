[package]
name = "muse-bridge"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Localhost OpenAI-compatible HTTP API driving `muse serve` over MSP/stdio"
license = "MIT"

[[bin]]
name = "muse-bridge"
path = "src/main.rs"

[[bin]]
name = "muse-acp-bridge"
path = "src/bin/acp_main.rs"

[lib]
name = "muse_bridge"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
# Justified additions (beyond the AGENTS.md locked set):
# - base64: validate `data:`-URL image payloads (MSP rejects invalid base64
#   with invalidParams; hand-rolling base64 is error-prone).
# - reqwest (rustls, no OpenSSL build dependency): fetch http(s) `image_url`
#   parts per SPEC §5.1 (timeout + size cap). Minimal features: rustls-tls
#   (pure-Rust TLS with WebPKI roots) + stream (capped body reads) + json
#   (serde helpers, also used by the HTTP compat tests);
#   env-proxy support is built in.
# - ring: audited SHA-256 for JetBrains AIR fork-point fingerprints
#   (`sha256:<hex>` over agent message text, FORK_PLAN P3). Already in the
#   dependency tree via rustls, so this direct edge adds zero new packages;
#   hand-rolling SHA-256 (muse-acp's sha256.rs) is out of the question.
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
ring = "0.17"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
